{{- /*
  Same as library-chart.secretGit, plus GIT_CREDENTIALS: the credentials of every Git
  provider connected in Onyxia, as JSON. Empty list when Onyxia doesn't provide them,
  the image then keeps its current behavior with GIT_PERSONAL_ACCESS_TOKEN.
*/ -}}
{{- if (.Values.git).enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "library-chart.secretNameGit" . }}
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
stringData:
  GIT_USER_NAME: {{ .Values.git.name | quote }}
  GIT_USER_MAIL: {{ .Values.git.email | quote }}
  GIT_CREDENTIALS_CACHE_DURATION: {{ .Values.git.cache | quote }}
  GIT_PERSONAL_ACCESS_TOKEN: {{ .Values.git.token | quote }}
  GIT_CREDENTIALS: {{ .Values.git.credentials | default list | toJson | quote }}
  GIT_REPOSITORY: {{ .Values.git.repository | quote }}
  GIT_BRANCH: {{ .Values.git.branch | quote }}
{{- end }}
