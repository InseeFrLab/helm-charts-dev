{{- /*
  Same as library-chart.secretGit, with the repositories chosen in the launcher and the
  Git providers connected in Onyxia:
  - ONYXIA_GIT_REPOSITORIES: git.repositories as JSON, { providerId, url, branch } each.
  - GIT_REPOSITORY / GIT_BRANCH: the first one, cloned by the current images.
  - ONYXIA_GIT_PROVIDERS: git.providers as JSON, read by the Git region init script.
*/ -}}
{{- if (.Values.git).enabled -}}
{{- $repository := first (.Values.git.repositories | default list) | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "library-chart.secretNameGit" . }}
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
stringData:
  GIT_USER_NAME: {{ .Values.git.name | quote }}
  GIT_USER_MAIL: {{ .Values.git.email | quote }}
  GIT_CREDENTIALS_CACHE_DURATION: {{ .Values.git.cache | quote }}
  GIT_PERSONAL_ACCESS_TOKEN: {{ .Values.git.token | quote }}
  GIT_REPOSITORY: {{ $repository.url | default "" | quote }}
  GIT_BRANCH: {{ $repository.branch | default "" | quote }}
  ONYXIA_GIT_REPOSITORIES: {{ .Values.git.repositories | default list | toJson | quote }}
  ONYXIA_GIT_PROVIDERS: {{ .Values.git.providers | default list | toJson | quote }}
{{- end }}
